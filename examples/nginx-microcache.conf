# nginx-microcache.conf: static HTML first, then a 15-second microcache in front of the app.
# Directives checked against nginx.org docs (proxy, upstream, gzip_static modules).
# Adjust paths, upstream address, and cookie names. Test with: nginx -t
#
# Traps this file avoids:
# 1. A response with Set-Cookie is NOT cached by proxy_cache (unless you add
#    `proxy_ignore_headers Set-Cookie`, which would cache one visitor's cookie for everyone).
#    Public pages must therefore be rendered without touching the session.
# 2. Cache-Control / Expires / X-Accel-Expires from the app take priority over
#    proxy_cache_valid. If the app sends `private` or `no-store`, nothing is cached.
# 3. nginx honors Vary (1.7.7+). `Vary: Cookie` from the app splits the cache per cookie
#    and the hit rate collapses. `Vary: *` is never cached.
# 4. Without proxy_cache_lock, a popular page that expires sends every waiting
#    request to the app at once (cache stampede).

# --- http {} context -------------------------------------------------------

proxy_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=micro:50m
                 max_size=2g inactive=10m use_temp_path=off;

upstream app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Requests that carry a session cookie. Used ONLY on personalized API paths below;
# public HTML ignores the session so logged-in and anonymous users share one entry.
map $cookie_session $has_session {
    default 1;
    ""      0;
}

# Cache key note: $request_uri keeps the query string as sent, so ?utm_source=x creates
# a separate entry. Strip tracking parameters and sort the rest at the CDN (or redirect
# to the clean URL in the app) rather than with regex maps here.

# --- server {} context -----------------------------------------------------

server {
    listen 80;
    server_name example.com;
    root /var/www/example/public;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Serve pre-compressed foo.html.gz next to foo.html when the client accepts gzip.
    # Needs nginx built --with-http_gzip_static_module (most distro packages are).
    gzip_static on;

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Personalized API: never cached, always reaches the app.
    location /api/me {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "private, no-store" always;
    }

    # Other API reads: microcache for anonymous callers only.
    location /api/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache micro;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 15s;
        proxy_cache_bypass $has_session;   # do not answer a session holder from cache
        proxy_no_cache     $has_session;   # do not store what a session holder got
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Public HTML: 1) a pre-built static file, 2) the microcache, 3) the app.
    location / {
        # Old pages written to disk as compressed HTML by the app (or a build job).
        # /post/123 -> /var/www/example/public/post/123.html (+ .html.gz)
        try_files $uri $uri.html @app;
    }

    location @app {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache micro;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 15s;          # only if the app sends no Cache-Control
        proxy_cache_valid 404 5s;
        proxy_cache_lock on;                # one request refreshes, the rest wait
        proxy_cache_lock_timeout 3s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;   # serve stale while refreshing (needs "updating" above)
        proxy_cache_revalidate on;          # refresh with If-Modified-Since / If-None-Match

        # The page must not depend on the session here. If the app still sets a
        # cookie on public HTML, fix the app; do not add proxy_ignore_headers Set-Cookie.
        add_header X-Cache-Status $upstream_cache_status always;  # MISS HIT EXPIRED STALE UPDATING REVALIDATED BYPASS
    }
}
